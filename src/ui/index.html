<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'">
  <title>MinMSN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <strong>MinMSN</strong>
    <span id="status">Väntar på inloggning…</span>
    <button id="toggle-fb">Visa Facebook-fönstret</button>
  </header>
  <main>
    <aside>
      <h2>Konversationer</h2>
      <ul id="conversations"><li class="empty">Logga in i Facebook-fönstret.</li></ul>
    </aside>
    <section id="chat">
      <h2 id="chat-title">Välj en konversation</h2>
      <div id="messages"></div>
      <div id="error" hidden></div>
      <form id="composer">
        <input id="text" autocomplete="off" placeholder="Skriv ett meddelande… 😊" disabled>
        <button id="emoji" type="button" disabled title="Emoji">😊</button>
        <button type="submit" disabled>Skicka</button>
      </form>
      <div id="emoji-panel" hidden></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
